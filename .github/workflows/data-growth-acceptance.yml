name: Accept First Data Growth Stage
on:
  push:
    branches: ["feature/data-volume-10000"]
    paths: ["config/data_volume.json","live/settings.py","benchmarks/live_ted_500.py",".github/workflows/data-growth-acceptance.yml"]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python run_pipeline.py
      - run: python checks/growth_data_acceptance.py
      - name: Record complete verified public data
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/ reports/ real_data/ted_live_normalized.json real_data/ted_live_enriched.json real_data/municipal_verified_events.json real_data/dresden_plan_reference.json real_data/early_verified_events.json real_data/early_source_registry.json real_data/early_observations.json real_data/lifecycle_notice_archive.json
          git diff --cached --quiet || git commit -m "Record complete 10000-notice quality-screened snapshot"
          git push origin HEAD:feature/data-volume-10000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-growth-evidence
          path: reports/
