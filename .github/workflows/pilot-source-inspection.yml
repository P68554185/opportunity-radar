name: Inspect Hamburg Pilot Sources
on:
  push:
    branches: ["feature/municipal-pilot-radius"]
    paths: ["geography/collect_hamburg.py", ".github/workflows/pilot-source-inspection.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public licensed reference data
        run: python geography/collect_hamburg.py
      - name: Save public source snapshots on feature branch
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add real_data/hamburg_open_data_snapshot.json reports/hamburg_geodata_collection.json
          git diff --cached --quiet || git commit -m "Record official Hamburg reference data"
          git push origin HEAD:feature/municipal-pilot-radius
