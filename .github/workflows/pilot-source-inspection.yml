name: Collect Dresden Pilot Evidence
on:
  push:
    branches: ["feature/municipal-pilot-radius"]
    paths: ["municipal/**", "geography/dresden.py", ".github/workflows/pilot-source-inspection.yml", "real_data/dresden_source_manifest.json"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python municipal/collect.py
      - run: python geography/dresden.py
      - run: python build_snapshot.py
      - name: Commit verified public pilot evidence
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add real_data/municipal_verified_events.json real_data/early_source_registry.json real_data/dresden_plan_reference.json docs/data/ reports/
          git diff --cached --quiet || git commit -m "Record verified Dresden municipal opportunities and locations"
          git push origin HEAD:feature/municipal-pilot-radius
