name: Inspect Dresden Pilot Sources
on:
  push:
    branches: ["feature/municipal-pilot-radius"]
    paths: ["geography/inspect_dresden.py", ".github/workflows/pilot-source-inspection.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public licensed WFS schemas
        run: python geography/inspect_dresden.py
      - name: Save public schema on feature branch
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/dresden_source_schema.json
          git diff --cached --quiet || git commit -m "Record official Dresden source schemas"
          git push origin HEAD:feature/municipal-pilot-radius
