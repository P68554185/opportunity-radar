name: Verify BauRadar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bauradar_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: bauradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bauradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python benchmarks/classifier_regression.py
      - name: Reproduce approved EARLY sources and discovery
        run: python early/collect.py
      - name: Rebuild and verify committed data
        run: python build_snapshot.py
      - name: Python syntax for operational checks
        run: python -m compileall -q backend checks intelligence live
      - name: JavaScript syntax
        run: |
          node --check docs/app.js
          node --check admin/app.js
      - name: Install backend and browser test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Test account isolation and sessions
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
        env:
          TEST_POSTGRES_URL: postgresql://bauradar_test:ci-only-test-password@localhost:5432/bauradar_test
      - name: Verify PostgreSQL persistence across actual process restart
        run: python checks/postgres_restart.py
        env:
          TEST_POSTGRES_URL: postgresql://bauradar_test:ci-only-test-password@localhost:5432/bauradar_test
      - name: Drill PostgreSQL backup and recovery in disposable databases
        run: python checks/postgres_restore.py
        env:
          TEST_POSTGRES_URL: postgresql://bauradar_test:ci-only-test-password@localhost:5432/bauradar_test
      - name: Test closed signup with two PostgreSQL accounts in Chromium
        run: python checks/closed_accounts.py
        env:
          TEST_POSTGRES_URL: postgresql://bauradar_test:ci-only-test-password@localhost:5432/bauradar_test
      - name: Test customer workflows in Chromium
        run: python checks/browser_smoke.py
      - name: Verify deployment configuration and container build
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet
          docker build -f backend/Dockerfile -t bauradar:test .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-bauradar-data
          path: |
            docs/data/
            reports/
