name: Verify BauRadar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python benchmarks/classifier_regression.py
      - name: Rebuild and verify committed data
        run: python build_snapshot.py
      - name: JavaScript syntax
        run: |
          node --check docs/app.js
          node --check admin/app.js
      - name: Install backend and browser test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Test account isolation and sessions
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Test customer workflows in Chromium
        run: python checks/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-bauradar-data
          path: |
            docs/data/
            reports/
