name: Live Data Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: ["main"]
    paths:
      - "early/**"
      - "municipal/**"
      - "geography/**"
      - "real_data/dresden_source_manifest.json"
      - "adapters/**"
      - "real_data/early_source_manifest.json"
      - "live/**"
      - "config/data_volume.json"
      - "benchmarks/**"
      - "classification/**"
      - "intelligence/**"
      - "run_pipeline.py"
      - "github_status.py"
      - "engine.py"
      - "lifecycle/**"
      - "tests/**"
      - "build_snapshot.py"

permissions:
  contents: write

concurrency:
  group: live-ingestion
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify engine before acquisition
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run Opportunity Radar pipeline
        run: python run_pipeline.py
      - name: Commit generated dashboard data
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/ reports/ real_data/ted_live_normalized.json real_data/ted_live_enriched.json real_data/municipal_verified_events.json real_data/dresden_plan_reference.json real_data/early_verified_events.json real_data/early_source_registry.json real_data/early_observations.json real_data/lifecycle_notice_archive.json || true
          git diff --cached --quiet || git commit -m "Update Opportunity Radar live intelligence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-run
          path: |
            reports/
            docs/data/
          if-no-files-found: warn
