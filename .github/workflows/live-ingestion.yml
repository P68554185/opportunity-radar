name: Live Data Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Opportunity Radar pipeline
        run: python run_pipeline.py

      - name: Commit generated dashboard data
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/ reports/ || true
          git diff --cached --quiet || git commit -m "Update Opportunity Radar live intelligence"
          git push

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-run
          path: |
            reports/
            docs/data/
          if-no-files-found: warn
