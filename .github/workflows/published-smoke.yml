name: Verify Published BauRadar
on:
  workflow_run:
    workflows: ["Deploy Website"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-smoke
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check actual published site
        run: python checks/deployed_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-bauradar-browser
          path: reports/deployed-browser/
